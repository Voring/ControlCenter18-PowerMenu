name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: c18-power-menu-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { date -u; uname -m; sw_vers; } | tee ci-probe.txt
          git add -f ci-probe.txt
          git commit -m "ci probe [skip ci]" || true
          git push origin HEAD:main || true

      - name: Install Theos (roothide) + iOS 16.5 SDK
        continue-on-error: true
        run: |
          set -x
          exec > >(tee install-log.txt) 2>&1
          brew install ldid xz
          rm -rf "$GITHUB_WORKSPACE/theos"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$GITHUB_WORKSPACE/theos"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          SDK_URL=$(curl -sL https://api.github.com/repos/theos/sdks/releases/latest | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['browser_download_url'] for a in d['assets'] if a['name']=='iPhoneOS16.5.sdk.tar.xz'))")
          echo "SDK: $SDK_URL"
          curl -L --fail -o /tmp/sdk.tar.xz "$SDK_URL"
          tar -xf /tmp/sdk.tar.xz -C "$GITHUB_WORKSPACE/theos/sdks"
          ls "$GITHUB_WORKSPACE/theos/sdks"

      - name: Build arm64e roothide
        continue-on-error: true
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -x
          exec > >(tee build-log.txt) 2>&1
          xcrun --sdk iphoneos --show-sdk-path || true
          xcrun clang --version || true
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e
          ls -l packages || true
          for f in packages/*.deb; do dpkg-deb -f "$f" Package Architecture Version Maintainer || true; file "$f" || true; done
          mkdir -p dist && cp packages/*.deb dist/ 2>/dev/null || true

      - name: Commit logs and deb
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch install-log.txt build-log.txt
          git add -f install-log.txt build-log.txt ci-probe.txt || true
          if ls dist/*.deb >/dev/null 2>&1; then git add -f dist/*.deb; fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci logs [skip ci]" || true
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
            done
          fi

      - name: Publish Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist/*.deb || { echo "no deb, skip release"; exit 0; }
          DEB=$(ls dist/*.deb | head -1)
          TAG="v1.0.0"
          cp "$DEB" "dist/C18PowerMenu_roothide_arm64e.deb"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/C18PowerMenu_roothide_arm64e.deb" --clobber
          else
            gh release create "$TAG" "dist/C18PowerMenu_roothide_arm64e.deb" \
              --title "C18 Power Menu 1.0.0 (roothide / arm64e)" \
              --notes "ControlCenter18 电源键 → 原生菜单：注销 / 重启 / 关机 / 安全模式 / 软重启设备 / 重启用户空间。\n\n构建：macos-15-intel + roothide Theos + iPhoneOS 16.5 SDK，THEOS_PACKAGE_SCHEME=roothide，ARCHS=arm64e。"
          fi
          gh release view "$TAG"
