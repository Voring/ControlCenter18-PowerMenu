name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: c18-power-menu-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Theos (roothide) + iOS 16.5 SDK
        run: |
          set -x
          exec > >(tee install-log.txt) 2>&1
          brew install ldid xz || true
          rm -rf "$GITHUB_WORKSPACE/theos"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$GITHUB_WORKSPACE/theos"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          if ! curl -L --fail -o /tmp/sdk.tar.xz "$SDK_URL"; then
            SDK_URL=$(curl -sfL https://api.github.com/repos/theos/sdks/releases/latest | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['browser_download_url'] for a in d.get('assets',[]) if a['name']=='iPhoneOS16.5.sdk.tar.xz'))")
            curl -L --fail -o /tmp/sdk.tar.xz "$SDK_URL"
          fi
          tar -xf /tmp/sdk.tar.xz -C "$GITHUB_WORKSPACE/theos/sdks"
          test -d "$GITHUB_WORKSPACE/theos/sdks/iPhoneOS16.5.sdk"

      - name: Build arm64e roothide
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -x
          exec > >(tee build-log.txt) 2>&1
          rm -rf packages dist
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e
          ls -l packages
          mkdir -p dist && cp packages/*.deb dist/

      - name: Commit logs and deb
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch install-log.txt build-log.txt
          git rm -r --cached dist >/dev/null 2>&1 || true
          rm -rf dist && mkdir -p dist
          if ls packages/*.deb >/dev/null 2>&1; then cp packages/*.deb dist/; fi
          git add -f install-log.txt build-log.txt || true
          git add -A dist || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci logs and deb [skip ci]" || true
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
            done
          fi

      - name: Publish Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist/*.deb || { echo "no deb, skip release"; exit 0; }
          DEB=$(ls -t dist/*.deb | head -1)
          cp "$DEB" /tmp/C18PowerMenu_roothide_arm64e.deb
          TAG="v1.7.12"
          cat > /tmp/notes.md <<'NOTES'
          C18 Power Menu 1.7.12 (roothide / arm64e)

          This build actually contains the fixes. The 1.7.10 and 1.7.11 packages were built from a stale source snapshot, so please install 1.7.12 instead.

          Userspace reboot now mirrors CCRespring exactly:
          - loads libroothide.dylib and calls its exported const char *jbroot(const char *)
          - spawns the translated /usr/bin/launchctl with "reboot userspace"
          - roothide unsandboxes SpringBoard (its preload calls unsandbox with the sb_token), so the spawn is allowed once the path is translated
          - if the spawn is still refused it falls back to ldrestart, never a silent no-op

          Reboot / shutdown, based on the FBSystemService method list dumped on-device (exitAndRelaunch:, shutdownAndReboot:, shutdownWithOptions:):
          - 重启设备 = shutdownAndReboot:YES (the old nil argument read as NO and powered the device off)
          - 设备关机 = shutdownAndReboot:NO

          Safe mode keeps killall -SEGV SpringBoard plus a forced in-process fault. Note this jailbreak has no Substrate-style safe mode catcher, so a SpringBoard crash simply reloads - CCRespring's SafeMode behaves the same here.

          Diagnostics land in /var/mobile/Library/C18PowerMenu.log: libroothide load result, the jbroot probe path, every spawn candidate and its rc.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/C18PowerMenu_roothide_arm64e.deb --clobber
            gh release edit "$TAG" --title "C18 Power Menu 1.7.12 (roothide / arm64e)" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" /tmp/C18PowerMenu_roothide_arm64e.deb \
              --title "C18 Power Menu 1.7.12 (roothide / arm64e)" --notes-file /tmp/notes.md
          fi
