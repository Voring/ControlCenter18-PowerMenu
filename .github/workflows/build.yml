name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u > ci-probe.txt
          uname -m >> ci-probe.txt
          git add -f ci-probe.txt
          git commit -m "ci probe [skip ci]" || true
          git push || true

      - name: Install Theos (roothide)
        continue-on-error: true
        run: |
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          SDK_URL=$(curl -sL https://api.github.com/repos/theos/sdks/releases/latest | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['browser_download_url'] for a in d['assets'] if a['name']=='iPhoneOS16.5.sdk.tar.xz'))")
          echo "SDK: $SDK_URL"
          curl -L --fail -o /tmp/sdk.tar.xz "$SDK_URL"
          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"

      - name: Build arm64e roothide
        continue-on-error: true
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          { make clean; make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e; } 2>&1 | tee build-log.txt

      - name: Commit build log
        if: always()
        run: |
          touch build-log.txt
          git add -f build-log.txt || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build log [skip ci]"
          git pull --rebase || true
          git push || true

      - name: Commit deb
        if: always()
        run: |
          ls packages/*.deb >/dev/null 2>&1 || exit 0
          mkdir -p dist
          cp packages/*.deb dist/
          git add -f dist/*.deb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deb build [skip ci]"
          git pull --rebase || true
          git push || true
