name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: c18-power-menu-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { date -u; uname -m; sw_vers; } | tee ci-probe.txt
          git add -f ci-probe.txt
          git commit -m "ci probe [skip ci]" || true
          git push origin HEAD:main || true

      - name: Install Theos (roothide) + iOS 16.5 SDK
        continue-on-error: true
        run: |
          set -x
          exec > >(tee install-log.txt) 2>&1
          brew install ldid xz
          rm -rf "$GITHUB_WORKSPACE/theos"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$GITHUB_WORKSPACE/theos"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          SDK_URL=$(curl -sL https://api.github.com/repos/theos/sdks/releases/latest | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['browser_download_url'] for a in d['assets'] if a['name']=='iPhoneOS16.5.sdk.tar.xz'))")
          echo "SDK: $SDK_URL"
          curl -L --fail -o /tmp/sdk.tar.xz "$SDK_URL"
          tar -xf /tmp/sdk.tar.xz -C "$GITHUB_WORKSPACE/theos/sdks"
          ls "$GITHUB_WORKSPACE/theos/sdks"

      - name: Build arm64e roothide
        continue-on-error: true
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -x
          exec > >(tee build-log.txt) 2>&1
          rm -rf packages dist
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e
          ls -l packages || true
          mkdir -p dist && cp packages/*.deb dist/ 2>/dev/null || true

      - name: Commit logs and deb
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch install-log.txt build-log.txt
          git rm -r --cached dist >/dev/null 2>&1 || true
          rm -rf dist && mkdir -p dist
          if ls packages/*.deb >/dev/null 2>&1; then cp packages/*.deb dist/; fi
          git add -f install-log.txt build-log.txt ci-probe.txt || true
          git add -A dist || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci logs and deb [skip ci]" || true
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
            done
          fi

      - name: Publish Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: C18 Power Menu 1.3.0 (roothide / arm64e)
          files: dist/*.deb
          fail_on_unmatched_files: false
          body: |
            C18 Power Menu 1.3.0（roothide / arm64e）

            触发方式：ControlCenter18 的电源按钮本来就只响应长按（短按是防误触空操作），插件挂在长按回调上。

            长按后：若已安装 CCRespring，直接实例化它的 CCRespringCCUIMenuModuleViewController，弹它自己的菜单；若它呈现为空（CC 模块控制器需要 CC 容器）则自动回退到我们的 UIAlertController 列表。

            菜单项：注销 / 重启 / 关机 / 安全模式 / 软重启设备 / 重启用户空间（外加取消）；关机交回系统原生的 presentPowerDownTransientOverlay。

            构建：macos-15-intel + roothide Theos + iPhoneOS 16.5 SDK，THEOS_PACKAGE_SCHEME=roothide，ARCHS=arm64e。
