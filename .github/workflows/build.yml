name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: c18-power-menu-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { date -u; uname -m; sw_vers; } | tee ci-probe.txt
          git add -f ci-probe.txt
          git commit -m "ci probe [skip ci]" || true
          git push origin HEAD:main || true

      - name: Install Theos (roothide) + iOS 16.5 SDK
        run: |
          set -x
          exec > >(tee install-log.txt) 2>&1
          brew install ldid xz || true
          rm -rf "$GITHUB_WORKSPACE/theos"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$GITHUB_WORKSPACE/theos"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          if ! curl -L --fail -o /tmp/sdk.tar.xz "$SDK_URL"; then
            SDK_URL=$(curl -sfL https://api.github.com/repos/theos/sdks/releases/latest | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['browser_download_url'] for a in d.get('assets',[]) if a['name']=='iPhoneOS16.5.sdk.tar.xz'))")
            curl -L --fail -o /tmp/sdk.tar.xz "$SDK_URL"
          fi
          tar -xf /tmp/sdk.tar.xz -C "$GITHUB_WORKSPACE/theos/sdks"
          test -d "$GITHUB_WORKSPACE/theos/sdks/iPhoneOS16.5.sdk"

      - name: Build arm64e roothide
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -x
          exec > >(tee build-log.txt) 2>&1
          rm -rf packages dist
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e
          ls -l packages
          mkdir -p dist && cp packages/*.deb dist/

      - name: Commit logs and deb
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch install-log.txt build-log.txt
          git rm -r --cached dist >/dev/null 2>&1 || true
          rm -rf dist && mkdir -p dist
          if ls packages/*.deb >/dev/null 2>&1; then cp packages/*.deb dist/; fi
          git add -f install-log.txt build-log.txt ci-probe.txt || true
          git add -A dist || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci logs and deb [skip ci]" || true
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
            done
          fi

      - name: Publish Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist/*.deb || { echo "no deb, skip release"; exit 0; }
          DEB=$(ls -t dist/*.deb | head -1)
          cp "$DEB" /tmp/C18PowerMenu_roothide_arm64e.deb
          TAG="v1.7.0"
          cat > /tmp/notes.md <<'NOTES'
          C18 Power Menu 1.7.0（roothide / arm64e）

          修复三个问题：
          1. 位置：系统私有的 _presentMenuAtLocation: 不认坐标（一直是屏幕居中），现改为自绘同款系统风格卡片，位置严格按 CC18 电源控件本身的 rect 计算（右边缘对齐按钮右边缘、顶部 = 按钮下缘 + 8，上方放不下就翻到按钮上方），横屏同样按控件定位。
          2. 点击无效：不再走 UIMenu 的 handler，行内直接用 UIButton，点击后 posix_spawn 执行命令（sbreload / killall SpringBoard / killall -SEGV / launchctl reboot userspace / reboot / SBLockScreenManager 关机），并在执行前查 jbroot 下的可执行路径，找不到才回落 /usr/bin 绝对路径。
          3. 二次长按失效：彻底不再用 UIContextMenuInteraction，没有交互复用与重入状态，重复长按每次都重新建卡片。

          外观：UIBlurEffect（SystemChromeMaterial）毛玻璃 + 左文字右 SF 图标 + 细分割线 + 红色取消，全屏一层极淡的模糊遮罩。
          图标：快速注销 rays / 强制注销 slowmo / 重启桌面 apps.iphone / 安全模式 shield.lefthalf.filled / 重启空间 arrow.clockwise.circle / 重启设备 exclamationmark.arrow.circlepath / 设备关机 power / 取消 trash。

          诊断日志：/var/mobile/Library/C18PowerMenu.log（记录了 glyph 矩形、卡片坐标、每条命令的 spawn 结果）。
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/C18PowerMenu_roothide_arm64e.deb --clobber
            gh release edit "$TAG" --title "C18 Power Menu 1.7.0 (roothide / arm64e)" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" /tmp/C18PowerMenu_roothide_arm64e.deb \
              --title "C18 Power Menu 1.7.0 (roothide / arm64e)" --notes-file /tmp/notes.md
          fi
