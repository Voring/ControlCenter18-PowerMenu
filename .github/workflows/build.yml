name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: c18-power-menu-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Theos (roothide) + iOS 16.5 SDK
        run: |
          set -x
          exec > >(tee install-log.txt) 2>&1
          brew install ldid xz || true
          rm -rf "$GITHUB_WORKSPACE/theos"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$GITHUB_WORKSPACE/theos"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          if ! curl -L --fail -o /tmp/sdk.tar.xz "$SDK_URL"; then
            SDK_URL=$(curl -sfL https://api.github.com/repos/theos/sdks/releases/latest | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['browser_download_url'] for a in d.get('assets',[]) if a['name']=='iPhoneOS16.5.sdk.tar.xz'))")
            curl -L --fail -o /tmp/sdk.tar.xz "$SDK_URL"
          fi
          tar -xf /tmp/sdk.tar.xz -C "$GITHUB_WORKSPACE/theos/sdks"
          test -d "$GITHUB_WORKSPACE/theos/sdks/iPhoneOS16.5.sdk"

      - name: Build arm64e roothide
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -x
          exec > >(tee build-log.txt) 2>&1
          rm -rf packages dist
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e
          ls -l packages
          mkdir -p dist && cp packages/*.deb dist/

      - name: Commit logs and deb
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch install-log.txt build-log.txt
          git rm -r --cached dist >/dev/null 2>&1 || true
          rm -rf dist && mkdir -p dist
          if ls packages/*.deb >/dev/null 2>&1; then cp packages/*.deb dist/; fi
          git add -f install-log.txt build-log.txt || true
          git add -A dist || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci logs and deb [skip ci]" || true
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
            done
          fi

      - name: Publish Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist/*.deb || { echo "no deb, skip release"; exit 0; }
          DEB=$(ls -t dist/*.deb | head -1)
          cp "$DEB" /tmp/C18PowerMenu_roothide_arm64e.deb
          TAG="v1.7.10"
          cat > /tmp/notes.md <<'NOTES'
          C18 Power Menu 1.7.10 (roothide / arm64e)

          Fixes for the three dead actions:
          - 重启设备 = Reboot: now calls shutdownAndReboot:YES. The old call passed nil, which reads as NO and powered the device off.
          - 设备关机 = Shutdown: shutdownAndReboot:NO, immediate power off.
          - 重启空间 = RebootUserspace: resolves the real roothide jbroot first, then launchctl reboot userspace; falls back to ldrestart when the sandbox blocks the spawn.
          - 安全模式 = SafeMode: killall -SEGV SpringBoard (same command CCRespring uses); if spawn is blocked it forces an in-process fault.

          Diagnostics: the log now records the resolved jbroot, every spawn candidate with its errno, and the FBSystemService selector dump.
          Log: /var/mobile/Library/C18PowerMenu.log
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/C18PowerMenu_roothide_arm64e.deb --clobber
            gh release edit "$TAG" --title "C18 Power Menu 1.7.10 (roothide / arm64e)" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" /tmp/C18PowerMenu_roothide_arm64e.deb \
              --title "C18 Power Menu 1.7.10 (roothide / arm64e)" --notes-file /tmp/notes.md
          fi
